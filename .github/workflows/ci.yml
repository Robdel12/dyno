name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Core / ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, node: 24 }
          - { os: ubuntu-latest, node: 26 }
          - { os: macos-latest, node: 24 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node-version: ${{ matrix.node }}
      - name: Validate workflows
        if: matrix.node == 24 && runner.os == 'Linux'
        run: bash .github/scripts/check-workflows.sh
      - uses: ./.github/actions/test
        with:
          suite: core
          artifact: core-${{ matrix.os }}-node-${{ matrix.node }}

  package:
    name: Package install / Node 26
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
      options: --user pwuser --init --ipc=host
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node-version: '26'
      - uses: ./.github/actions/test
        with:
          suite: package
          browser: chromium
          artifact: package-node-26

  browser:
    name: ${{ matrix.suite }} / Linux / ${{ matrix.engine }}
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
      options: --user pwuser --init --ipc=host
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, firefox, webkit]
        suite: [browser, capture, native]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/test
        with:
          suite: ${{ matrix.suite }}
          browser: ${{ matrix.engine }}
          artifact: ${{ matrix.suite }}-linux-${{ matrix.engine }}

  browser-macos:
    name: ${{ matrix.suite }} / macOS / ${{ matrix.engine }}
    needs: checks
    runs-on: macos-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, firefox, webkit]
        suite: [browser, capture, native]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Install Playwright engine
        id: install-engine
        env:
          DYNO_ENGINE: ${{ matrix.engine }}
        run: node bin/dyno.js install --browser "$DYNO_ENGINE"
      - uses: ./.github/actions/test
        with:
          suite: ${{ matrix.suite }}
          browser: ${{ matrix.engine }}
          artifact: ${{ matrix.suite }}-macos-${{ matrix.engine }}

  complete:
    name: CI complete
    if: ${{ always() }}
    needs: [checks, package, browser, browser-macos]
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require every suite
        env:
          DYNO_JOB_RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          read -r -a results <<< "$DYNO_JOB_RESULTS"
          for result in "${results[@]}"; do
            if [[ "$result" != 'success' ]]; then
              echo "A required suite finished with: $result"
              exit 1
            fi
          done
