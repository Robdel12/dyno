name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Core / Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        node: [24, 26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node-version: ${{ matrix.node }}
      - name: Validate workflows
        if: matrix.node == 24
        run: bash .github/scripts/check-workflows.sh
      - uses: ./.github/actions/test
        with:
          suite: core
          artifact: core-node-${{ matrix.node }}

  package:
    name: Package install / Node 26
    runs-on: ubuntu-latest
    timeout-minutes: 5
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
      options: --user pwuser --init --ipc=host
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node-version: '26'
      - uses: ./.github/actions/test
        with:
          suite: package
          browser: chromium
          artifact: package-node-26

  browser:
    name: ${{ matrix.suite.name }} / ${{ matrix.engine }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
      options: --user pwuser --init --ipc=host
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, firefox, webkit]
        # Two jobs per engine. On its own, each smaller suite is mostly setup time.
        suite:
          - { name: browser + execution, run: 'browser,execution', artifact: workflows }
          - { name: reporter + project + native + repeat + capture, run: 'reporter,project,native,repeat,capture', artifact: features }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/test
        with:
          suite: ${{ matrix.suite.run }}
          browser: ${{ matrix.engine }}
          artifact: ${{ matrix.suite.artifact }}-${{ matrix.engine }}

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
      options: --user pwuser --init --ipc=host
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: npm --prefix site ci
      - run: npm --prefix site run generate -- --check-markdown
      - run: npm --prefix site run build
      - run: npm --prefix site test

  complete:
    name: CI complete
    if: ${{ always() }}
    needs: [checks, package, browser, docs]
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require every suite
        env:
          DYNO_JOB_RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          read -r -a results <<< "$DYNO_JOB_RESULTS"
          for result in "${results[@]}"; do
            if [[ "$result" != 'success' ]]; then
              echo "A required suite finished with: $result"
              exit 1
            fi
          done
