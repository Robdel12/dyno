name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Core / Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        node: [24, 26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node-version: ${{ matrix.node }}
      - name: Validate workflows
        if: matrix.node == 24
        run: bash .github/scripts/check-workflows.sh
      - uses: ./.github/actions/test
        with:
          suite: core
          artifact: core-node-${{ matrix.node }}

  package:
    name: Package install / Node 26
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node-version: '26'
      - uses: ./.github/actions/test
        with:
          suite: package
          artifact: package-node-26

  browser:
    name: Native / ${{ matrix.os }} / ${{ matrix.browser }}
    needs: checks
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        browser: [chrome, firefox, edge]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Prepare hosted Edge
        if: runner.os == 'Linux' && matrix.browser == 'edge'
        run: bash .github/scripts/install-edge.sh
      - run: node bin/dyno.js browsers --json
      - uses: ./.github/actions/test
        with:
          suite: browser
          browser: ${{ matrix.browser }}
          artifact: native-${{ matrix.os }}-${{ matrix.browser }}
      - name: Edge sandbox diagnostics
        if: failure() && runner.os == 'Linux' && matrix.browser == 'edge'
        run: |
          sudo journalctl --boot --no-pager --grep='msedge|apparmor="DENIED"' --lines=20
          sudo coredumpctl --no-pager list /opt/microsoft/msedge/msedge || true

  capture:
    name: Screenshots / ${{ matrix.provider }} / ${{ matrix.browser }}
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - { provider: playwright, browser: chromium }
          - { provider: playwright, browser: firefox }
          - { provider: playwright, browser: webkit }
          - { provider: webdriver, browser: chrome }
          - { provider: webdriver, browser: firefox }
          - { provider: webdriver, browser: edge }
    env:
      DYNO_CAPTURE_PROVIDER: ${{ matrix.provider }}
      DYNO_CAPTURE_BROWSER: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Prepare hosted Edge
        if: matrix.browser == 'edge'
        run: bash .github/scripts/install-edge.sh
      - name: Install matching Playwright engine
        if: matrix.provider == 'playwright'
        env:
          DYNO_ENGINE: ${{ matrix.browser }}
        run: npx --no-install playwright-core install --with-deps "$DYNO_ENGINE"
      - uses: ./.github/actions/test
        with:
          suite: capture
          artifact: screenshots-${{ matrix.provider }}-${{ matrix.browser }}
      - name: Edge sandbox diagnostics
        if: failure() && matrix.browser == 'edge'
        run: |
          sudo journalctl --boot --no-pager --grep='msedge|apparmor="DENIED"' --lines=20
          sudo coredumpctl --no-pager list /opt/microsoft/msedge/msedge || true

  complete:
    name: CI complete
    if: ${{ always() }}
    needs: [checks, package, browser, capture]
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require every suite
        env:
          DYNO_JOB_RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          read -r -a results <<< "$DYNO_JOB_RESULTS"
          for result in "${results[@]}"; do
            if [[ "$result" != 'success' ]]; then
              echo "A required suite finished with: $result"
              exit 1
            fi
          done
