name: Docs

on:
  push:
    branches: [main]
  workflow_run:
    workflows: [Release documentation]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

# Publications share one index. Complete one before assembling the next.
concurrency:
  group: dyno-docs-publication
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: npm --prefix site ci
      - run: npm --prefix site run build
      - name: Download released docs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: node site/scripts/releases.js download "$RUNNER_TEMP/dyno-docs-archives"
      - name: Assemble all versions
        run: node site/scripts/archive.js assemble site/dist "$RUNNER_TEMP/dyno-docs-archives" site/published
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: documentation
          path: site/published
          include-hidden-files: true
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        if: vars.DYNO_DOCS_DEPLOY == 'true'
        with:
          path: site/published

  deploy:
    if: vars.DYNO_DOCS_DEPLOY == 'true'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
