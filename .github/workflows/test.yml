name: Browser workflows
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        browser: [chrome, firefox, edge]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      # Use the hosted browser installations instead of unpacked downloads.
      - name: Restore Edge sandbox permissions
        if: runner.os == 'Linux' && matrix.browser == 'edge'
        shell: bash
        run: |
          sudo chown root:root /opt/microsoft/msedge/msedge-sandbox
          sudo chmod 4755 /opt/microsoft/msedge/msedge-sandbox
          stat --format='%U:%G %a %n' /opt/microsoft/msedge/msedge-sandbox
      - run: npm ci
      - run: node bin/dyno.js browsers --json
      - name: Run browser workflows
        shell: bash
        env:
          DYNO_CI_BROWSER: ${{ matrix.browser }}
        run: |
          if [[ "$RUNNER_OS" == 'Linux' ]]; then
            exec dbus-run-session -- node scripts/test.js "$DYNO_CI_BROWSER"
          fi
          exec node scripts/test.js "$DYNO_CI_BROWSER"
