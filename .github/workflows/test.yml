name: Browser workflows
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        browser: [chrome, firefox, edge]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2
        if: matrix.browser == 'chrome'
        id: chrome
        with:
          chrome-version: stable
          install-dependencies: true
      - uses: browser-actions/setup-firefox@0bc507ddf224827e3b1af68e014d5e42ab93e795 # v1
        if: matrix.browser == 'firefox'
        id: firefox
        with:
          firefox-version: latest
      - uses: browser-actions/setup-edge@e2f31d5d9f2e6d75e72516221b4df8528e6325cf # v1
        if: matrix.browser == 'edge'
        id: edge
        with:
          edge-version: stable
      - run: npm ci
      - run: node scripts/test.js ${{ matrix.browser }}
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
          FIREFOX_PATH: ${{ steps.firefox.outputs.firefox-path }}
          EDGE_PATH: ${{ steps.edge.outputs.edge-path }}
