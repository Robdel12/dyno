name: Browser workflows
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        browser: [chrome, firefox, edge]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - name: Install official Edge package
        if: runner.os == 'Linux' && matrix.browser == 'edge'
        shell: bash
        run: |
          curl --fail --silent --show-error --location https://packages.microsoft.com/keys/microsoft.asc | gpg --dearmor > "$RUNNER_TEMP/microsoft-edge.gpg"
          sudo install -m 644 "$RUNNER_TEMP/microsoft-edge.gpg" /usr/share/keyrings/microsoft-edge.gpg
          echo 'deb [arch=amd64 signed-by=/usr/share/keyrings/microsoft-edge.gpg] https://packages.microsoft.com/repos/edge stable main' | sudo tee /etc/apt/sources.list.d/microsoft-edge.list
          sudo apt-get update -o Dir::Etc::sourcelist=sources.list.d/microsoft-edge.list -o Dir::Etc::sourceparts=- -o APT::Get::List-Cleanup=0
          sudo apt-get install --reinstall --no-install-recommends -y microsoft-edge-stable
          dpkg-query --show --showformat='${Package} ${Version}\n' microsoft-edge-stable
      - name: Repair hosted Edge sandbox setup
        if: runner.os == 'Linux' && matrix.browser == 'edge'
        shell: bash
        run: |
          sudo chown root:root /opt/microsoft/msedge/msedge-sandbox
          sudo chmod 4755 /opt/microsoft/msedge/msedge-sandbox
          stat --format='%U:%G %a %n' /opt/microsoft/msedge/msedge-sandbox
          # The image ships overlapping Edge profiles. Load one explicit userns
          # allowance, like Ubuntu's Chrome profile, so Edge keeps its sandbox.
          mapfile -t profiles < <(sudo grep -l '/opt/microsoft/msedge/msedge' /etc/apparmor.d/* 2>/dev/null || true)
          for profile in "${profiles[@]}"; do
            echo "Replacing Edge attachment: $profile"
            sudo apparmor_parser --remove "$profile"
          done
          sudo tee /etc/apparmor.d/msedge >/dev/null <<'PROFILE'
          abi <abi/4.0>,
          include <tunables/global>
          profile msedge /opt/microsoft/msedge/msedge flags=(unconfined) {
            userns,
          }
          PROFILE
          sudo apparmor_parser --replace /etc/apparmor.d/msedge
      - run: npm ci
      - run: node bin/dyno.js browsers --json
      - name: Run browser workflows
        shell: bash
        env:
          DYNO_CI_BROWSER: ${{ matrix.browser }}
        run: |
          if [[ "$RUNNER_OS" == 'Linux' ]]; then
            exec dbus-run-session -- node scripts/test.js "$DYNO_CI_BROWSER"
          fi
          exec node scripts/test.js "$DYNO_CI_BROWSER"
      - name: Edge sandbox diagnostics
        if: failure() && runner.os == 'Linux' && matrix.browser == 'edge'
        shell: bash
        run: |
          sudo journalctl --boot --no-pager --grep='msedge|apparmor="DENIED"' --lines=20
          sudo coredumpctl --no-pager list /opt/microsoft/msedge/msedge || true
  capture:
    name: Capture (${{ matrix.provider }} / ${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - { provider: playwright, browser: chromium }
          - { provider: playwright, browser: firefox }
          - { provider: playwright, browser: webkit }
          - { provider: webdriver, browser: chrome }
          - { provider: webdriver, browser: firefox }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install matching Playwright engine
        if: matrix.provider == 'playwright'
        run: npx playwright-core install --with-deps ${{ matrix.browser }}
      - name: Capture real app pixels and exercise lifecycle
        env:
          DYNO_CAPTURE_PROVIDER: ${{ matrix.provider }}
          DYNO_CAPTURE_BROWSER: ${{ matrix.browser }}
        run: dbus-run-session -- npm run test:capture
