<main class="control-room">
  <!-- wordmark -->
  <h1>Control room</h1>
  <p>Tests run in this window while your app gets its own tab. Keep both open until you stop Dyno.</p>
  <p id="reporter" hidden>Follow results, run single tests, and stop the run from the reporter. Open it in any browser:
    <a id="reporter-link" target="_blank" rel="noopener"></a></p>
  <div id="execution" aria-label="Test execution"></div>
  <p id="host-error" role="alert" hidden></p>
</main>
